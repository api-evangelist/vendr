aid: vendr
name: Vendr
description: >-
  Vendr is a SaaS procurement intelligence platform that helps businesses manage software spending through data-driven
  pricing insights and negotiation guidance. The Vendr API (OpenPrice API) provides access to real contract pricing data
  from 200,000+ verified software agreements across 20,000+ products, enabling developers to embed fair pricing
  estimates, negotiation insights, product catalog data, and purchase scope management into their applications.
type: Index
accessModel:
