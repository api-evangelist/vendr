  name: Vendr MCP Server
  description: >-
    The Vendr Model Context Protocol (MCP) server exposes Vendr pricing intelligence to AI agents via
    the MCP standard. It provides tools for searching the product catalog, retrieving custom price estimates,
    and obtaining negotiation insights. Requires a Vendr API key.
